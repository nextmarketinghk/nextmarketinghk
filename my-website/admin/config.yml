backend:
  name: github
  repo: nextmarketinghk/nextmarketinghk
  branch: main
  site_domain: nextmarketinghk.pages.dev
  base_url: https://decap-cms-oauth.vercel.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "網頁內容"
    files:
      - file: "content/site.json"
        label: "主頁文字設定"
        name: "homepage"
        fields:
          - { label: "Hero 標題", name: "hero_title", widget: "string" }
          - { label: "Hero 副標題 (EN)", name: "hero_tagline_en", widget: "text" }
          - { label: "Hero 副標題 (繁中)", name: "hero_tagline_zh", widget: "text" }
          - { label: "聯絡 Email", name: "contact_email", widget: "string" }
