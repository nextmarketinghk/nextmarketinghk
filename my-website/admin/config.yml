backend:
  name: github
  repo: nextmarketinghk/nextmarketinghk
  branch: main

media_folder: "my-website/public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "網頁內容管理"
    files:
      - file: "my-website/content/site.json"
        label: "全站文字設定 (Full Site Content)"
        name: "homepage"
        format: "json"
        fields:
          # 1. 頂部導航欄
          - name: "nav_sec"
            label: "1. 頂部導航欄"
            widget: "object"
            fields:
              - { label: "Logo文字", name: "logo_text", widget: "string" }
              - { label: "選單 1", name: "nav_1", widget: "string" }
              - { label: "選單 2", name: "nav_2", widget: "string" }
              - { label: "選單 3", name: "nav_3", widget: "string" }
              - { label: "按鈕文字", name: "nav_button", widget: "string" }

          # 2. 首頁主視覺 (Hero) - 已加入英文標題
          - name: "hero_sec"
            label: "2. 首頁主視覺 (Hero)"
            widget: "object"
            fields:
              - { label: "主標題", name: "hero_title", widget: "string" }
              - { label: "英文副標題 (Tagline EN)", name: "hero_tagline_en", widget: "text" }
              - { label: "中文副標題 (Tagline ZH)", name: "hero_tagline_zh", widget: "text" }
              - { label: "主要按鈕文字", name: "hero_btn_main", widget: "string" }
              - { label: "次要按鈕文字", name: "hero_btn_sub", widget: "string" }

          # 3. 服務與優勢
          - name: "services_sec"
            label: "3. 服務與優勢"
            widget: "object"
            fields:
              - { label: "區塊標題", name: "title", widget: "string" }
              - { label: "區塊副標題", name: "subtitle", widget: "text" }
              - name: "items"
                label: "服務項目列表"
                widget: "list"
                fields:
                  - { label: "服務名稱", name: "item_title", widget: "string" }
                  - { label: "服務內容描述", name: "item_desc", widget: "text" }

          # 4. 關於我們
          - name: "about_sec"
            label: "4. 關於我們"
            widget: "object"
            fields:
              - { label: "區塊標題", name: "title", widget: "string" }
              - { label: "詳細介紹內容", name: "body_content", widget: "markdown" }

          # 5. 頁尾與聯絡資料
          - name: "footer_sec"
            label: "5. 頁尾與聯絡資料"
            widget: "object"
            fields:
              - { label: "聯絡 Email", name: "contact_email", widget: "string" }
              - { label: "聯絡電話", name: "contact_phone", widget: "string" }
              - { label: "公司地址", name: "address", widget: "string" }
              - { label: "版權宣告", name: "copyright", widget: "string" }
