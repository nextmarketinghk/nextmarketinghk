backend:
  name: github
  repo: nextmarketinghk/nextmarketinghk
  branch: main

media_folder: "my-website/public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "網頁內容管理"
    files:
      - file: "my-website/content/site.json"
        label: "全站文字文案與顏色管理 (Full Site Content)"
        name: "homepage"
        format: "json"
        fields:
          # 1. Navigation Section
          - name: "nav_sec"
            label: "1. 頂部導覽列 (Navigation)"
            widget: "object"
            fields:
              - { label: "選單 1 (中)", name: "nav_1_zh", widget: "string" }
              - { label: "選單 1 (EN)", name: "nav_1_en", widget: "string" }
              - { label: "選單 1 顏色 (#hex)", name: "nav_1_color", widget: "string", required: false }
              - { label: "選單 2 (中)", name: "nav_2_zh", widget: "string" }
              - { label: "選單 2 (EN)", name: "nav_2_en", widget: "string" }
              - { label: "選單 2 顏色 (#hex)", name: "nav_2_color", widget: "string", required: false }
              - { label: "選單 3 (中)", name: "nav_3_zh", widget: "string" }
              - { label: "選單 3 (EN)", name: "nav_3_en", widget: "string" }
              - { label: "選單 3 顏色 (#hex)", name: "nav_3_color", widget: "string", required: false }

          # 2. Hero Section
          - name: "hero_sec"
            label: "2. 首頁 Hero 主視覺區塊"
            widget: "object"
            fields:
              - { label: "小標題", name: "subtitle", widget: "string" }
              - { label: "小標題顏色 (#hex)", name: "subtitle_color", widget: "string", required: false }
              - { label: "大標題前段 (中)", name: "h1_prefix_zh", widget: "string" }
              - { label: "大標題前段 (EN)", name: "h1_prefix_en", widget: "string" }
              - { label: "大標題前段顏色 (#hex)", name: "h1_prefix_color", widget: "string", required: false }
              - { label: "大標題螢光黃字 (中)", name: "h1_highlight_zh", widget: "string" }
              - { label: "大標題螢光黃字 (EN)", name: "h1_highlight_en", widget: "string" }
              - { label: "大標題螢光黃字顏色 (#hex)", name: "h1_highlight_color", widget: "string", required: false }
              - { label: "大標題後段 (中)", name: "h1_suffix_zh", widget: "string" }
              - { label: "大標題後段 (EN)", name: "h1_suffix_en", widget: "string" }
              - { label: "大標題後段顏色 (#hex)", name: "h1_suffix_color", widget: "string", required: false }
              - { label: "簡介敘述 (中)", name: "tagline_zh", widget: "text" }
              - { label: "簡介敘述 (EN)", name: "tagline_en", widget: "text" }
              - { label: "簡介敘述顏色 (#hex)", name: "tagline_color", widget: "string", required: false }
              - { label: "按鈕文字 (中)", name: "btn_zh", widget: "string" }
              - { label: "按鈕文字 (EN)", name: "btn_en", widget: "string" }
              - { label: "按鈕顏色 (#hex)", name: "btn_color", widget: "string", required: false }

          # 3. About Section
          - name: "about_sec"
            label: "3. 關於我們 (About Section)"
            widget: "object"
            fields:
              - { label: "區塊小標題 (中)", name: "section_label_zh", widget: "string" }
              - { label: "區塊小標題 (EN)", name: "section_label_en", widget: "string" }
              - { label: "區塊小標題顏色 (#hex)", name: "section_label_color", widget: "string", required: false }
              - { label: "主標題 (中)", name: "main_title_zh", widget: "string" }
              - { label: "主標題 (EN)", name: "main_title_en", widget: "string" }
              - { label: "主標題顏色 (#hex)", name: "main_title_color", widget: "string", required: false }
              - { label: "左側卡片 (中)", name: "card_left_zh", widget: "text" }
              - { label: "左側卡片 (EN)", name: "card_left_en", widget: "text" }
              - { label: "左側卡片顏色 (#hex)", name: "card_left_color", widget: "string", required: false }
              - { label: "右側卡片 (中)", name: "card_right_zh", widget: "text" }
              - { label: "右側卡片 (EN)", name: "card_right_en", widget: "text" }
              - { label: "右側卡片顏色 (#hex)", name: "card_right_color", widget: "string", required: false }

          # 4. Services Section
          - name: "services_sec"
            label: "4. 服務範疇 (Services Section)"
            widget: "object"
            fields:
              - { label: "區塊標題 (中)", name: "section_label_zh", widget: "string" }
              - { label: "區塊標題 (EN)", name: "section_label_en", widget: "string" }
              - { label: "區塊標題顏色 (#hex)", name: "section_label_color", widget: "string", required: false }
              
              - { label: "服務 1 標題 (中)", name: "s1_title_zh", widget: "string" }
              - { label: "服務 1 標題 (EN)", name: "s1_title_en", widget: "string" }
              - { label: "服務 1 標題顏色 (#hex)", name: "s1_title_color", widget: "string", required: false }
              - { label: "服務 1 項目 1 (中)", name: "s1_item1_zh", widget: "string" }
              - { label: "服務 1 項目 1 (EN)", name: "s1_item1_en", widget: "string" }
              - { label: "服務 1 項目 1 顏色 (#hex)", name: "s1_item1_color", widget: "string", required: false }
              - { label: "服務 1 項目 2 (中)", name: "s1_item2_zh", widget: "string" }
              - { label: "服務 1 項目 2 (EN)", name: "s1_item2_en", widget: "string" }
              - { label: "服務 1 項目 2 顏色 (#hex)", name: "s1_item2_color", widget: "string", required: false }
              - { label: "服務 1 項目 3 (中)", name: "s1_item3_zh", widget: "string" }
              - { label: "服務 1 項目 3 (EN)", name: "s1_item3_en", widget: "string" }
              - { label: "服務 1 項目 3 顏色 (#hex)", name: "s1_item3_color", widget: "string", required: false }
              - { label: "服務 1 項目 4 (中)", name: "s1_item4_zh", widget: "string" }
              - { label: "服務 1 項目 4 (EN)", name: "s1_item4_en", widget: "string" }
              - { label: "服務 1 項目 4 顏色 (#hex)", name: "s1_item4_color", widget: "string", required: false }

              - { label: "服務 2 標題 (中)", name: "s2_title_zh", widget: "string" }
              - { label: "服務 2 標題 (EN)", name: "s2_title_en", widget: "string" }
              - { label: "服務 2 標題顏色 (#hex)", name: "s2_title_color", widget: "string", required: false }
              - { label: "服務 2 項目 1 (中)", name: "s2_item1_zh", widget: "string" }
              - { label: "服務 2 項目 1 (EN)", name: "s2_item1_en", widget: "string" }
              - { label: "服務 2 項目 1 顏色 (#hex)", name: "s2_item1_color", widget: "string", required: false }
              - { label: "服務 2 項目 2 (中)", name: "s2_item2_zh", widget: "string" }
              - { label: "服務 2 項目 2 (EN)", name: "s2_item2_en", widget: "string" }
              - { label: "服務 2 項目 2 顏色 (#hex)", name: "s2_item2_color", widget: "string", required: false }

              - { label: "服務 3 標題 (中)", name: "s3_title_zh", widget: "string" }
              - { label: "服務 3 標題 (EN)", name: "s3_title_en", widget: "string" }
              - { label: "服務 3 標題顏色 (#hex)", name: "s3_title_color", widget: "string", required: false }
              - { label: "服務 3 項目 1 (中)", name: "s3_item1_zh", widget: "string" }
              - { label: "服務 3 項目 1 (EN)", name: "s3_item1_en", widget: "string" }
              - { label: "服務 3 項目 1 顏色 (#hex)", name: "s3_item1_color", widget: "string", required: false }
              - { label: "服務 3 項目 2 (中)", name: "s3_item2_zh", widget: "string" }
              - { label: "服務 3 項目 2 (EN)", name: "s3_item2_en", widget: "string" }
              - { label: "服務 3 項目 2 顏色 (#hex)", name: "s3_item2_color", widget: "string", required: false }

          # 5. Contact Section
          - name: "contact_sec"
            label: "5. 聯絡我們與頁尾 (Contact & Footer)"
            widget: "object"
            fields:
              - { label: "標題 (中)", name: "main_title_zh", widget: "string" }
              - { label: "標題 (EN)", name: "main_title_en", widget: "string" }
              - { label: "標題顏色 (#hex)", name: "main_title_color", widget: "string", required: false }
              - { label: "描述 (中)", name: "desc_zh", widget: "text" }
              - { label: "描述 (EN)", name: "desc_en", widget: "text" }
              - { label: "描述顏色 (#hex)", name: "desc_color", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Email 顏色 (#hex)", name: "email_color", widget: "string", required: false }
              - { label: "版權宣告", name: "copyright", widget: "string" }
              - { label: "版權宣告顏色 (#hex)", name: "copyright_color", widget: "string", required: false }
