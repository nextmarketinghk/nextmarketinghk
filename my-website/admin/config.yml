backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - file: "content/site.json"
        label: "Site Copies & Colors"
        name: "site_data"
        fields:
          # Navigation
          - name: "nav_sec"
            label: "Navigation Bar"
            widget: "object"
            fields:
              - { label: "Nav 1 (English)", name: "nav_1_en", widget: "string" }
              - { label: "Nav 1 (Chinese)", name: "nav_1_zh", widget: "string" }
              - { label: "Nav 1 Color", name: "nav_1_color", widget: "color", default: "#ffffff" }
              - { label: "Nav 2 (English)", name: "nav_2_en", widget: "string" }
              - { label: "Nav 2 (Chinese)", name: "nav_2_zh", widget: "string" }
              - { label: "Nav 2 Color", name: "nav_2_color", widget: "color", default: "#ffffff" }
              - { label: "Nav 3 (English)", name: "nav_3_en", widget: "string" }
              - { label: "Nav 3 (Chinese)", name: "nav_3_zh", widget: "string" }
              - { label: "Nav 3 Color", name: "nav_3_color", widget: "color", default: "#ffffff" }

          # Hero Section
          - name: "hero_sec"
            label: "Hero Section"
            widget: "object"
            fields:
              - { label: "Subtitle Text", name: "subtitle", widget: "string" }
              - { label: "Subtitle Color", name: "subtitle_color", widget: "color", default: "#ffffff" }
              - { label: "H1 Prefix Text", name: "h1_prefix", widget: "string" }
              - { label: "H1 Prefix Color", name: "h1_prefix_color", widget: "color", default: "#ffffff" }
              - { label: "H1 Highlight Text", name: "h1_highlight", widget: "string" }
              - { label: "H1 Highlight Color", name: "h1_highlight_color", widget: "color", default: "#ffea00" }
              - { label: "H1 Suffix Text", name: "h1_suffix", widget: "string" }
              - { label: "H1 Suffix Color", name: "h1_suffix_color", widget: "color", default: "#ffffff" }
              - { label: "Tagline Text", name: "tagline", widget: "text" }
              - { label: "Tagline Color", name: "tagline_color", widget: "color", default: "#ffffff" }
              - { label: "Button Text", name: "btn", widget: "string" }
              - { label: "Button Color", name: "btn_color", widget: "color", default: "#000000" }

          # About Section
          - name: "about_sec"
            label: "About Section"
            widget: "object"
            fields:
              - { label: "Section Label", name: "section_label", widget: "string" }
              - { label: "Section Label Color", name: "section_label_color", widget: "color", default: "#ff007a" }
              - { label: "Main Title", name: "main_title", widget: "string" }
              - { label: "Main Title Color", name: "main_title_color", widget: "color", default: "#000000" }
              - { label: "Card Left Text", name: "card_left", widget: "text" }
              - { label: "Card Left Color", name: "card_left_color", widget: "color", default: "#ffffff" }
              - { label: "Card Right Text", name: "card_right", widget: "text" }
              - { label: "Card Right Color", name: "card_right_color", widget: "color", default: "#ffffff" }

          # Services Section
          - name: "services_sec"
            label: "Services Section"
            widget: "object"
            fields:
              - { label: "Section Label", name: "section_label", widget: "string" }
              - { label: "Section Label Color", name: "section_label_color", widget: "color", default: "#ffea00" }
              - { label: "Service 1 Title", name: "s1_title", widget: "string" }
              - { label: "Service 1 Title Color", name: "s1_title_color", widget: "color", default: "#ffea00" }
              - { label: "Service 1 Item 1", name: "s1_item1", widget: "string" }
              - { label: "Service 1 Item 1 Color", name: "s1_item1_color", widget: "color", default: "#ffffff" }
              - { label: "Service 1 Item 2", name: "s1_item2", widget: "string" }
              - { label: "Service 1 Item 2 Color", name: "s1_item2_color", widget: "color", default: "#ffffff" }
              - { label: "Service 1 Item 3", name: "s1_item3", widget: "string" }
              - { label: "Service 1 Item 3 Color", name: "s1_item3_color", widget: "color", default: "#ffffff" }
              - { label: "Service 1 Item 4", name: "s1_item4", widget: "string" }
              - { label: "Service 1 Item 4 Color", name: "s1_item4_color", widget: "color", default: "#ffffff" }
              - { label: "Service 2 Title", name: "s2_title", widget: "string" }
              - { label: "Service 2 Title Color", name: "s2_title_color", widget: "color", default: "#ffea00" }
              - { label: "Service 2 Item 1", name: "s2_item1", widget: "string" }
              - { label: "Service 2 Item 1 Color", name: "s2_item1_color", widget: "color", default: "#ffffff" }
              - { label: "Service 2 Item 2", name: "s2_item2", widget: "string" }
              - { label: "Service 2 Item 2 Color", name: "s2_item2_color", widget: "color", default: "#ffffff" }
              - { label: "Service 3 Title", name: "s3_title", widget: "string" }
              - { label: "Service 3 Title Color", name: "s3_title_color", widget: "color", default: "#ffea00" }
              - { label: "Service 3 Item 1", name: "s3_item1", widget: "string" }
              - { label: "Service 3 Item 1 Color", name: "s3_item1_color", widget: "color", default: "#ffffff" }
              - { label: "Service 3 Item 2", name: "s3_item2", widget: "string" }
              - { label: "Service 3 Item 2 Color", name: "s3_item2_color", widget: "color", default: "#ffffff" }

          # Contact Section
          - name: "contact_sec"
            label: "Contact Section"
            widget: "object"
            fields:
              - { label: "Section Label", name: "section_label", widget: "string" }
              - { label: "Section Label Color", name: "section_label_color", widget: "color", default: "#ffffff" }
              - { label: "Main Title", name: "main_title", widget: "string" }
              - { label: "Main Title Color", name: "main_title_color", widget: "color", default: "#ffffff" }
              - { label: "Subtitle", name: "sub_title", widget: "string" }
              - { label: "Subtitle Color", name: "sub_title_color", widget: "color", default: "#ffffff" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "Email Color", name: "email_color", widget: "color", default: "#ffffff" }
              - { label: "Copyright Text", name: "copyright", widget: "string" }
              - { label: "Copyright Color", name: "copyright_color", widget: "color", default: "#a1a1a1" }
