backend:
  name: github
  repo: nextmarketinghk/nextmarketinghk
  branch: main

media_folder: "my-website/public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "網頁內容管理"
    files:
      - file: "my-website/content/site.json"
        label: "首頁內容 (Homepage Content)"
        name: "homepage"
        format: "json"
        fields:
          - name: "about_sec"
            label: "關於我們區塊 (About Section)"
            widget: "object"
            fields:
              - { label: "區塊小標題 (中)", name: "section_label_zh", widget: "string" }
              - { label: "區塊小標題 (EN)", name: "section_label_en", widget: "string" }
              - { label: "主標題 (中)", name: "main_title_zh", widget: "string" }
              - { label: "主標題 (EN)", name: "main_title_en", widget: "string" }
              - { label: "左側卡片文字 (中)", name: "card_left_zh", widget: "text" }
              - { label: "左側卡片文字 (EN)", name: "card_left_en", widget: "text" }
              - { label: "右側卡片文字 (中)", name: "card_right_zh", widget: "text" }
              - { label: "右側卡片文字 (EN)", name: "card_right_en", widget: "text" }
