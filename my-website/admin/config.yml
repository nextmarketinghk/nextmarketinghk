backend:
  name: github
  repo: nextmarketinghk/nextmarketinghk
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "網頁內容管理"
    files:
      - file: "content/site.json"
        label: "全站文字設定 (Full Site Content)"
        name: "homepage"
        fields:
          # --- 頂部導航欄 ---
          - name: "nav_sec"
            label: "1. 頂部導航欄 (Navigation Bar)"
            widget: "object"
            fields:
              - { label: "品牌名稱/Logo文字", name: "logo_text", widget: "string" }
              - { label: "選單 1 (Menu 1)", name: "nav_1", widget: "string" }
              - { label: "選單 2 (Menu 2)", name: "nav_2", widget: "string" }
              - { label: "選單 3 (Menu 3)", name: "nav_3", widget: "string" }
              - { label: "按鈕文字 (CTA Button)", name: "nav_button", widget: "string" }

          # --- 首頁主視覺 Hero ---
          - name: "hero_sec"
            label: "2. 首頁主視覺 (Hero Section)"
            widget: "object"
            fields:
              - { label: "主標題 (Main Title)", name: "hero_title", widget: "string" }
              - { label: "英文副標題 (EN Subtitle)", name: "hero_tagline_en", widget: "text" }
              - { label: "中文副標題 (ZH Subtitle)", name: "hero_tagline_zh", widget: "text" }
              - { label: "主要按鈕文字", name: "hero_btn_main", widget: "string" }
              - { label: "次要按鈕文字", name: "hero_btn_sub", widget: "string" }

          # --- 服務與優勢 ---
          - name: "services_sec"
            label: "3. 服務與優勢 (Services & Features)"
            widget: "object"
            fields:
              - { label: "區塊標題 (Section Title)", name: "title", widget: "string" }
              - { label: "區塊副標題 (Section Subtitle)", name: "subtitle", widget: "text" }
              - name: "items"
                label: "服務項目列表"
                widget: "list"
                fields:
                  - { label: "服務名稱", name: "item_title", widget: "string" }
                  - { label: "服務內容描述", name: "item_desc", widget: "text" }

          # --- 關於我們 ---
          - name: "about_sec"
            label: "4. 關於我們 (About Us)"
            widget: "object"
            fields:
              - { label: "區塊標題", name: "title", widget: "string" }
              - { label: "詳細介紹內容", name: "body_content", widget: "markdown" }

          # --- 頁尾與聯絡資料 ---
          - name: "footer_sec"
            label: "5. 頁尾與聯絡資料 (Footer & Contact)"
            widget: "object"
            fields:
              - { label: "聯絡 Email", name: "contact_email", widget: "string" }
              - { label: "聯絡電話", name: "contact_phone", widget: "string" }
              - { label: "公司地址", name: "address", widget: "string" }
              - { label: "版權宣告 (Copyright)", name: "copyright", widget: "string" }
